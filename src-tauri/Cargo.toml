[package]
name = "mejores-tomas"
version = "0.1.0"
description = "Mejores Tomas: selecciona las mejores fotos de una ráfaga, en local."
edition = "2021"
rust-version = "1.80"

[lib]
name = "mejores_tomas_lib"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
