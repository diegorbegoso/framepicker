name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Compuerta de calidad
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      - name: Rust (versión de rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen --directory engine

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm lint:engine
      - run: pnpm typecheck:engine
      - run: pnpm test:engine
      # Tauri exige que exista la carpeta del front (dist) para compilar el shell.
      - run: pnpm build:ui
      - run: pnpm test:rust
